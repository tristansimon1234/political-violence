name: Purge du brut

# Purge manuelle du bucket `radar-brut` (décision du 04/10/2026) : fichiers de N jours ou plus.
# Le résumé compte les commentaires encore non classés qui seraient perdus.
# Secrets : SUPABASE_SECRET_KEY, RADAR_SEL.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run : liste seulement, rien n'est supprimé"
        type: boolean
        default: true
      retention:
        description: "Âge en jours à partir duquel purger"
        default: "30"

concurrency:
  group: purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: https://yqzgtkaeodibfujienyj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RADAR_SEL: ${{ secrets.RADAR_SEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Purge
        env:
          RETENTION: ${{ inputs.retention }}
        run: |
          set -o pipefail
          [[ "$RETENTION" =~ ^[0-9]+$ ]] || { echo "retention invalide"; exit 1; }
          ARGS=(--retention "$RETENTION")
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          python scripts/purge.py "${ARGS[@]}" | tee rapport.md
      - name: Résumé
        if: always()
        run: cat rapport.md >> "$GITHUB_STEP_SUMMARY" || true
