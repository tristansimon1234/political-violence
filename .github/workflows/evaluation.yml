name: Évaluation Jev / Claude

# Lancement manuel uniquement (étape 4). Ordre : sonde → preparer → (étiquetage) → evaluer.
# Secrets : SUPABASE_SECRET_KEY, ANTHROPIC_API_KEY, AI_GATEWAY_API_KEY.
# Les fichiers de travail restent dans le bucket privé `radar-brut` (dossier evaluation/,
# purgé à 30 jours) ; le résumé n'affiche que des agrégats.

on:
  workflow_dispatch:
    inputs:
      commande:
        description: "sonde : 1 appel test ; preparer : échantillon ; evaluer : classement + rapport ; synthetique : 100 commentaires fictifs ; arbitrer : désaccords à trancher ; arbitrage : lecture de l'arbitrage rempli"
        type: choice
        options: [sonde, preparer, evaluer, synthetique, arbitrer, arbitrage]
        default: sonde
      budget_claude:
        description: "Dollars max pour Claude"
        default: "3"
      budget_jev:
        description: "Dollars max pour Jev"
        default: "1"
      option:
        description: "Facultatif : --remplacer (preparer, arbitrer) ; --reclasser, --contexte ou --contexte --reclasser (evaluer)"
        default: ""
      fichier:
        description: "synthetique : fichier du dossier evaluation/"
        default: "synthetique_v2.csv"
      serie:
        description: "Échantillon : 1 = premier, 2 = second (étiqueté à froid)"
        default: "1"

concurrency:
  group: evaluation
  cancel-in-progress: false

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: https://yqzgtkaeodibfujienyj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Évaluation
        env:
          FICHIER: ${{ inputs.fichier }}
        run: |
          set -o pipefail
          ARGS=("${{ inputs.commande }}" --budget-claude "${{ inputs.budget_claude }}" --budget-jev "${{ inputs.budget_jev }}")
          case "${{ inputs.option }}" in
            --remplacer|--reclasser|--contexte) ARGS+=("${{ inputs.option }}") ;;
            "--contexte --reclasser") ARGS+=(--contexte --reclasser) ;;
            "") ;;
            *) echo "option inconnue"; exit 1 ;;
          esac
          [[ "${{ inputs.serie }}" =~ ^[1-9]$ ]] || { echo "série invalide"; exit 1; }
          ARGS+=(--serie "${{ inputs.serie }}")
          if [ "${{ inputs.commande }}" = "synthetique" ]; then
            [[ "$FICHIER" =~ ^[A-Za-z0-9_.-]+\.csv$ ]] || { echo "nom de fichier invalide"; exit 1; }
            ARGS+=(--fichier "evaluation/$FICHIER")
          fi
          python scripts/evaluation.py "${ARGS[@]}" | tee rapport.md
      - name: Résumé
        if: always()
        run: cat rapport.md >> "$GITHUB_STEP_SUMMARY" || true
      # Données synthétiques uniquement (jamais de commentaire réel) : fichier d'arbitrage et clé.
      - name: Arbitrage
        if: inputs.commande == 'synthetique'
        uses: actions/upload-artifact@v4
        with:
          name: arbitrage
          path: arbitrage/
          retention-days: 7
          if-no-files-found: ignore
