name: Classification

# Classification en masse des commentaires collectés (Jev seul, docs/decisions.md du 02/10/2026).
# Lancement manuel. Relancer ne reclasse rien : seuls les commentaires absents du bucket
# `radar-classe` partent. Arrêt propre au budget ; relancer pour continuer.
# Secrets : SUPABASE_SECRET_KEY, AI_GATEWAY_API_KEY, ANTHROPIC_API_KEY, RADAR_SEL.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run : volumes et coût estimé, aucun appel"
        type: boolean
        default: true
      budget_jev:
        description: "Dollars max pour Jev"
        default: "20"
      budget_claude:
        description: "Dollars max pour Claude (nature des vidéos)"
        default: "5"
      paralleles:
        description: "Appels Jev simultanés"
        default: "10"
      limite:
        description: "Facultatif : au plus N commentaires (essai)"
        default: ""
      direct:
        description: "Décrire les vidéos sans l'API Batch (résultat immédiat, 2 à 3 fois plus cher)"
        type: boolean
        default: false
      etape:
        description: "tout : vidéos puis commentaires ; videos : décrire les vidéos seulement (peut tourner en même temps qu'un run « tout »)"
        type: choice
        options: [tout, videos]
        default: tout

concurrency:
  group: classification-${{ inputs.etape }}
  cancel-in-progress: false

jobs:
  classification:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      SUPABASE_URL: https://yqzgtkaeodibfujienyj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RADAR_SEL: ${{ secrets.RADAR_SEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Classification
        env:
          LIMITE: ${{ inputs.limite }}
          PARALLELES: ${{ inputs.paralleles }}
        run: |
          set -o pipefail
          [[ "$PARALLELES" =~ ^[0-9]+$ ]] || { echo "paralleles invalide"; exit 1; }
          ARGS=(--budget-jev "${{ inputs.budget_jev }}" --budget-claude "${{ inputs.budget_claude }}" --paralleles "$PARALLELES")
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "${{ inputs.etape }}" = "videos" ]; then ARGS+=(--videos-seulement); fi
          if [ "${{ inputs.direct }}" = "true" ]; then ARGS+=(--direct); fi
          if [ -n "$LIMITE" ]; then
            [[ "$LIMITE" =~ ^[0-9]+$ ]] || { echo "limite invalide"; exit 1; }
            ARGS+=(--limite "$LIMITE")
          fi
          python scripts/classification.py "${ARGS[@]}" | tee rapport.md
      - name: Résumé
        if: always()
        run: cat rapport.md >> "$GITHUB_STEP_SUMMARY" || true
