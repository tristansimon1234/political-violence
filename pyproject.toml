[project]
name = "radar"
version = "0.1.0"
description = "Radar 2027 : ce qui fait réagir les commentateurs YouTube pendant la présidentielle"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["ruff", "pyright", "pytest", "types-requests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["radar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["radar", "scripts", "tests"]
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
